aid: julia-computing
name: Julia Computing
description: >-
  JuliaHub, Inc. (founded in 2015 as Julia Computing by the creators of the Julia
  programming language) develops the open-source Julia language and operates JuliaHub,
  a cloud platform for scientific and technical computing. JuliaHub provides hosted
  Julia compute, package hosting and the Julia package registry, notebooks, and
  large-scale batch/job execution. Its product portfolio includes JuliaHub (cloud
  compute), Dyad (equation-based modeling and simulation), Pumas (pharmaceutical
  modeling and simulation), and the Julia language itself, serving aerospace, pharma,
  industrials, government, and utilities. Programmatic access is provided through the
  first-party JuliaHub.jl Julia client and OpenID Connect (Dex) authentication.
